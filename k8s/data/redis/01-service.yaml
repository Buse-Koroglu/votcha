apiVersion: v1
kind: Service
metadata:
  name: redis-svc
  namespace: votcha-dev
spec:
  type: ClusterIP
  selector:
    app: redis-db
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379
