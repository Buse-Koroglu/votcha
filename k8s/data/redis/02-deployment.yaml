apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: votcha-dev
  name: redis
spec:
  serviceName: "redis-svc"
  replicas: 1
  selector:
    matchLabels:
      app: redis-db
  template:
    metadata:
      labels:
        app: redis-db
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: redis
        image: redis:7-alpine
        #Redis'in veriyi diske sürekli yazması (AOF) için bu komutla başlatmak en sağlıklıdır:
        command: ["redis-server", "--appendonly", "yes"]
        ports:
          - containerPort: 6379
        volumeMounts:
          - name: cache-storage
            mountPath: /data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "250m"
  volumeClaimTemplates:
  - metadata:
      name: cache-storage
    spec:
      storageClassName: manual
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 500Mi

