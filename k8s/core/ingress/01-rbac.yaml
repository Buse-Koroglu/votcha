# Defines which resources (pods, services, etc.) this user is authorized to access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nginx-ingress-cluster-role
  namespace: nginx-ingress
rules:
  - apiGroups: [""]
    resources: ["configmaps","endpoints","nodes","pods","secrets","services","namespaces"]
    verbs: ["get","list","watch"]
  
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses","ingressclasses"]
    verbs: ["get","list","watch"]
  
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get","list","watch"]

  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get","list","watch","create","update"]
  
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update","patch"]

---
# "Bu yetkileri şu kullanıcıya ver" diyerek ikisini birbirine bağlar.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nginx-ingress-cluster-role-binding
subjects:
- kind: ServiceAccount
  name: nginx-ingress-service-account
  namespace: nginx-ingress
roleRef:
  kind: ClusterRole
  name: nginx-ingress-cluster-role
  apiGroup: rbac.authorization.k8s.io

---
# It is the “identity card” that the Ingress Controller uses to access the Kubernetes API. It is required for reading Ingress resources (rules).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx-ingress-service-account
  namespace: nginx-ingress