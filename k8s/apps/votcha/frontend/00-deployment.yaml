apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: votcha
    component: frontend
    tier: ui
  namespace: votcha-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: votcha
      component: frontend
      tier: ui
  template:
    metadata:
      labels:
        app: votcha
        component: frontend
        tier: ui
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: frontend-container
          image: ghcr.io/enesuluc/votcha-frontend:6.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
