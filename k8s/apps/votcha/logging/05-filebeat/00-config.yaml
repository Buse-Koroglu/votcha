apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: votcha-dev
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: filestream
        id: wedorgo-votcha-logs
        paths:
          - "/var/log/wedorgo/*.json"
          - "/var/log/wedorgo/archived/*.json"
        parsers:
          - ndjson:
              target: ""
              add_error_key: true
    output.logstash:
      hosts: ["logstash:5044"]
    logging.level: info
