apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: votcha-dev
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        monitor: 'votcha-monitor'
    scrape_configs: 
      - job_name: 'prometheus'
        scheme: https
        tls_config:
          insecure_skip_verify: true
        scrape_interval: 10s
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'votcha'
        scrape_interval: 10s
        static_configs:
          - targets: ['backend-service:8090']
        metrics_path: '/actuator/prometheus'