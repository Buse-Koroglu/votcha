services:
  app:
    build: .
    container_name: votcha
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${APP_PORT}:8090"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - votcha_network
    volumes:
      - ./logs:/app/logs
  db:
    container_name: votcha_db
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - votcha_vol:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    networks:
      - votcha_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d votcha" ]
      interval: 30s
      timeout: 10s
      retries: 5
networks:
  votcha_network:
    driver: bridge
volumes:
  votcha_vol:
