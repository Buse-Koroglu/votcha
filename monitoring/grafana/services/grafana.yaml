services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana

    environment:
      - GF_SECURITY_ADMIN_USER=grafanadmin
      - GF_SECURITY_ADMIN_PASSWORD=grafanadmin
      - GF_SERVER_ROOT_URL=https://localhost/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true

    networks:
      - votcha_network

    restart: always