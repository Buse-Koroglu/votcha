name: Votify API CI Pipeline

on:
  push:
    branches: ["main","development"]
  pull_request:
    branches: ["main","development"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DB: votify_meet
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: enes
        ports:
          - 5434:5432 # Uygulaman 5434 beklediği için GitHub'da da bu portu açıyoruz
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build and Run Tests
      run: mvn -B clean package --file pom.xml

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Make start.sh executable
      run: chmod +x start.sh

    - name: Start application
      run: ./start.sh

    - name: Check containers
      run: docker compose ps

    - name: Stop services
      if: always()
      run: docker compose down -v

    - name: Clear or Initialize logs
      run: |
        mkdir -p ./logs
        touch ./logs/app-log.json
        printf "" > ./logs/app-log.json